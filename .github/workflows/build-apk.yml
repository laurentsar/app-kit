# Workflow de build APK partagé par les applications Capacitor.
#
# Appelé par le workflow d'une app (`uses:` + `secrets: inherit`), il remplace
# les copies divergentes qui vivaient dans chaque dépôt : même chaîne Node/JDK/
# SDK, même restauration de clé depuis les secrets, même publication de release.
# Ce qui variait d'une app à l'autre devient des entrées.
#
# La clé de signature n'est JAMAIS dans un dépôt : elle arrive par les secrets
# ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD du dépôt appelant, posés
# depuis ~/app-kit/keys (voir app-kit/tools/migrate_signing.py).
name: Build APK (partagé)

on:
  workflow_call:
    inputs:
      apk_name:
        description: "Base du nom de l'APK et de l'artefact (ex. bornes-ve)"
        required: true
        type: string
      release_name:
        description: "Nom affiché de la release (ex. Bornes VE), suivi de la version"
        required: true
        type: string
      regen_android:
        description: "Régénérer android/ au build (dépôts qui ne versionnent pas la plateforme)"
        default: false
        type: boolean
      ci_scripts:
        description: "Scripts ci/*.py à exécuter dans l'ordre, séparés par des espaces"
        default: ""
        type: string
      pillow:
        description: "Installer Pillow avant les scripts ci (génération d'icônes)"
        default: false
        type: boolean
      ndk:
        description: "Installer NDK + CMake (apps avec du code natif à compiler)"
        default: false
        type: boolean
      node_version:
        default: "20"
        type: string
      java_version:
        default: "17"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # 'tools' (paquet legacy du SDK Manager, distinct de cmdline-tools)
          # n'existe plus dans le dépôt Google — c'est le défaut de cette
          # action ("tools platform-tools"), qui échoue donc désormais
          # systématiquement. platform-tools (adb...) suffit : les
          # plateformes/build-tools sont résolues par Gradle lui-même
          # pendant le build, une fois les licences acceptées.
          packages: 'platform-tools'

      - name: Install NDK and CMake
        if: inputs.ndk
        run: yes | sdkmanager "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      # android/ n'est pas versionné dans certaines apps : on le régénère, ce
      # qui évite de maintenir à la main un dossier généré de 400 fichiers.
      - name: Regenerate Android platform
        if: inputs.regen_android
        run: |
          rm -rf android
          npx cap add android

      - name: Install Pillow
        if: inputs.pillow
        run: pip install --quiet Pillow

      # Patches propres à l'app (signature, manifeste, icônes, version…),
      # exécutés dans l'ordre donné : l'ordre compte, patch_signing.py doit
      # passer avant que Gradle lise sa configuration.
      - name: Run app CI scripts
        if: inputs.ci_scripts != ''
        run: |
          for s in ${{ inputs.ci_scripts }}; do
            echo "::group::$s"
            python3 "$s"
            echo "::endgroup::"
          done

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_B64 absent"; exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/signing.p12

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version détectée : $VERSION"

      - name: Rename APK with version
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ inputs.apk_name }}-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.apk_name }}-release-apk
          path: ${{ inputs.apk_name }}-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ inputs.release_name }} v${{ steps.version.outputs.version }}
          files: ${{ inputs.apk_name }}-${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
